name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: corepack enable

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux:Tauri 系统依赖
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          # runner 镜像自带的 azure-cli/microsoft 源偶发 403,先摘掉再 update
          sudo rm -f /etc/apt/sources.list.d/*azure-cli* /etc/apt/sources.list.d/*microsoft*
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc)
        run: pnpm exec tsc --noEmit

      - name: Rust fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust tests
        working-directory: src-tauri
        # Windows runner 上测试二进制加载失败(STATUS_ENTRYPOINT_NOT_FOUND,
        # 环境性 DLL 问题,与代码无关;e2e 同因已整体跳过),Windows 只编译不跑测试
        run: cargo test --locked
        if: runner.os != 'Windows'
      - name: Rust build check (Windows)
        working-directory: src-tauri
        run: cargo test --locked --no-run
        if: runner.os == 'Windows' 

      - name: Frontend build
        run: pnpm build
